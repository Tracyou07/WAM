# Consumed by gradientwam-cine; independent data entry, shared OpenWAM method runtime.
name: gradientwam_cine_v3
data:
  dataset_name: cine_v3
  dataset_type: cine_v3_latent
  local_root: null
  replay_status_path: null
  replay_status_policy: include_all
  val_replay_status_policy: null
  require_replay_status: false
  val_require_replay_status: false
  empty_text_embedding_path: null
  split: train
  camera_names: [observation.images.color]
  latent_camera_names: [observation.images.color]
  canonical_height: 224
  canonical_width: 448
  num_frames: 9
  frame_stride: 1
  sample_stride: 32 # Cache each 32-command window once; frame_stride remains 1.
  sample_construction:
    mode: uniform_segment
    sample_order_mode: replacement
    chunk_size: 4
    window_size: 64
    randomize_geometry: false
    segment_min_frames: 9
    segment_max_frames: 9
    segment_length_stride: 1
    segment_locality_block_size: 1
    randomize_segment_length: false
    randomize_segment_start: false
    require_full_segment: true
    task_start_power: 0.0
    demo_count_power: 0.0
    trajectory_start_power: 0.0
    sample_weight_mode: uniform
  episode_cache_size: 2
  train_fraction: 1.0
  split_seed: 0
  train_batch_size: 1
  val_batch_size: 1
  num_workers: 8
  view_layout:
  - source_name: observation.images.color
    canonical_name: color
    top: 0
    left: 0
    height: 224
    width: 448
  action_schema:
    action_dim: 7
    # Nine target latent slots, four action slots per latent; prefix masks are adapter-owned.
    action_horizon: 36
    state_dim: 7
    state_horizon: 1
  action_target:
    representation: raw
    source_key: action
    pose_source_key: observation.state
    state_encoding: identity
    reference_source: anchor_state
    rotation_representation: axis_angle
    include_gripper: false
    gripper_representation: action_command
    gripper_action_index: -1
backbone:
  implementation: shared_transformer
  train_attn_mode: flex
  infer_attn_mode: torch
  hidden_size: 3072
  num_layers: 30
  num_heads: 24
  attention_head_dim: 128
  ffn_dim: 14336
  pretrained_model_name_or_path: null
  transformer_subdir: transformer
  max_text_tokens: 512
  load_wan_vae_frontend: false
  load_text_conditioning: false
  load_reference_core_weights: false
  reference_core_init_mode: video_only
  reference_assets_device_policy: cpu_offload
policy_variant:
  name: dual_expert
  hidden_size: 3072
  attach_site: post_visual_core
  preset: fastwam_joint
  program: decoupled_same_step
  sequence_contract: legacy_prefix_single_frame_perchunk_proprio
  joint_timestep_coupling: independent
  condition_mode: teacher_forcing_cond_video
  video_prefix_frames: 1
  action_expert_init_mode: video_weight_interpolate
  num_action_layers: 30
  action_hidden_size: 2048
  action_ffn_dim: 8192
  noisy_video_condition_prob: 0.5
  use_activation_checkpointing: true
action_decoder:
  name: dual_expert_decoder
  hidden_size: 3072
  action_dim: 7
  action_horizon: 36 # Native factory shares the declared horizon with data.
training:
  video_num_train_timesteps: 1000
  action_num_train_timesteps: 1000
  video_sigma_shift: 5.0
  action_sigma_shift: 1.0
  use_teacher_forcing: false
  chunk_size: 4
  window_size: 64
  sample_loss_weight_mode: none
  optimizer_name: adamw
  scheduler_name: constant_with_warmup
  learning_rate: 1.0e-05
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  warmup_steps: 10
  gradient_accumulation_steps: 10
  max_grad_norm: 2.0
  num_steps: 10000
  text_condition_dropout_prob: 0.1
  enabled_objectives:
  - action
  - latent
  latent_loss_weight: 1.0
  action_loss_weight: 1.0
  trainable_components:
  - policy_variant.action_expert
  - visual_tower.runtime_backbone
inference:
  video_num_inference_steps: 20
  action_num_inference_steps: 20
  frame_chunk_size: 9 # Nine inference latent slots x four action slots.
  attention_window_size: 30
  use_cache: true
  guidance_scale: 5.0
trainer:
  max_epochs: 1
  limit_train_batches: null
  limit_val_batches: 0
  log_every_n_steps: 1
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  enable_checkpointing: false
  enable_model_summary: false
  runtime: composable
  batch_adapter: latents
  loop_policy: steps
  strategy: single_device
  save_interval: 100
  checkpoint_mode: full_training_state
  export_runtime_backbone: false
  enable_jsonl_logging: false
  enable_wandb: false
  wandb_project: gradientwam-cine
  wandb_mode: disabled
